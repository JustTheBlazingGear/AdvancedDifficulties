tiers = Tiers
waves = Waves

advdiff-tierIncrease = Enemy Unit Tier Increase
advdiff-tierIncrease.info = Enemy units that come from waves and from factories will be increased in tier.\n[lightgray](daggers will turn into maces, flares into horizons and so on).[]\nIf the tier cannot be decreased/increased any further, Degradation/Radiance will be applied,\n halving/doubling health and damage as well as slight decrease/increase in movement speed and firerate per tier.\n\nT0, T6 and T7 units are planned, but they are far from being implemented.\n\nCompatible with following mods (tho not guaranteed to be balanced):\nNew Horizon, Asthosus, Frozen Farlands, Exoprosopa.
advdiff-wavesPerWave = Waves Per Wave
advdiff-wavesPerWave.info = Amount of waves that get sent in a burst, resulting larger and more diverse waves.

#Toggles
advdiff-shieldsToRadiance = Shields To Radiance
advdiff-shieldsToRadiance.info = If a unit spawn gains enough shields (x2 times their max health to be exact, next tier will require x4, then x8 and so on),\ntheir Radiance tier will be increased by one, doubling health and damage as well as slight increase in movement speed and firerate per tier.\nAutomatically enables if tier increase is above 1.\nDoesn't affect the calculated global difficulty.
advdiff-enemyTypeRandomizer = Enemy Type Randomizer
advdiff-enemyTypeRandomizer.info = Unit types from waves will be randomized.\nAffects only Serpulo units, because Erekir and modded units might get stuck if they turn into a wrong unit type.\nDoesn't affect the calculated global difficulty.
#Enrage has been unused
advdiff-enrageOnMaxUnits = Enrage On Max Units [WIP]
advdiff-enrageOnMaxUnits.info = When a spawn hits the cap, usually about 40, that spawn will gain Enraged status effect\n(x1.5 damage,x1.5 reload, x1.5 speed).\nDoesn't affect the calculated global difficulty.
advdiff-forceRadiance = Force Radiance
advdiff-forceRadiance.info = All spawned enemies will have Radiance status effect, doubling health and damage as well as slight increase in movement speed and firerate per tier.\nHas 7 tiers, 6th tier radiance makes Dagger strong enough to solo a Reign.

advdiff-moddedAsExtraTiers = Modded Units as Extra Tiers
advdiff-exogenesisoldAsExtraTiers = Exogenesis Old
advdiff-exogenesisoldAsExtraTiers.info = If a vanilla unit tries to go above T5, units from Exogenesis mod will be used.\nDon't use Java Exogenesis.\nWell balanced.\nEnabling this while not having the required mod won't do anything.
advdiff-exogenesisAsExtraTiers = Exogenesis (Java)
advdiff-exogenesisAsExtraTiers.info = If a vanilla unit tries to go above T5, units from Exogenesis mod will be used.\nJava version of the mod is required.\nEven though the mod is unfinished and raw, it is well balanced.\nIf Enemy Type Randomizer is on, enemies might turn into their alternative versions.\nEnabling this while not having the required mod won't do anything.
advdiff-newHorizonAsExtraTiers = New Horizon
advdiff-newHorizonAsExtraTiers.info = If a vanilla unit tries to go above T5, units from New Horizon mod will be used.\nEnabling this while not having the required mod won't do anything.


