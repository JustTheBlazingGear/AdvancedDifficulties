#Sliders
setting.advdiff-enemyHealthMultiplier.name = Enemy Health
setting.advdiff-enemyDamageMultiplier.name = Enemy Damage
setting.advdiff-enemySpawnMultiplier.name = Enemy Amount
setting.advdiff-waveTimeMultiplier.name = Wave Timer
setting.advdiff-enemyHealthMultiplier.description = These modifiers are independent to modifiers from difficulty and the effects will stack.\nAlso affects enemy structures.
setting.advdiff-enemyDamageMultiplier.description = These modifiers are independent to modifiers from difficulty and the effects will stack.\nAlso affects enemy structures.
setting.advdiff-enemySpawnMultiplier.description = These modifiers are independent to modifiers from difficulty and the effects will stack.
setting.advdiff-waveTimeMultiplier.description = These modifiers are independent to modifiers from difficulty and the effects will stack.

setting.advdiff-initialWaveSpacingMultiplier.name = Initial Wave Timer
setting.advdiff-initialWaveSpacingMultiplier.description = Only affects the timer before first wave starts. 0% means the wave will start as soon as you land.
setting.advdiff-captureWaveMultiplier.name = Capture Wave Multiplier
setting.advdiff-captureWaveMultiplier.description = Multiplies the amount of waves required to capture a sector.
setting.advdiff-tierIncrease.name = Enemy unit tier increase
setting.advdiff-tierIncrease.description = Enemy units that come from waves will be increased in tier.\n[lightgray](daggers will turn into maces, flares into horizons and so on).[] Cannot be changed mid game.\nFor every tier increase, all enemy reconstructors will work x3 times faster.\n[lightgray](Might figure out later how to increase the tier of constructed units).[]

#Toggles
setting.advdiff-enemyTypeRandomizer.name = Enemy Type Randomizer
setting.advdiff-enemyTypeRandomizer.description = Unit types of wave enemy units is randomized. Doesn't affect naval units.
setting.advdiff-oneShotOneKill.name = One Shot - One Kill
setting.advdiff-oneShotOneKill.description = Everything - allied and enemy, units and buildings - die from any attack.
setting.advdiff-enrageOnMaxUnits.name = Enrage On Max Units [WIP]
setting.advdiff-enrageOnMaxUnits.description = When a spawn hits the cap, usually about 40, that spawn will gain Enraged status effect\n(x1.5 damage,x1.5 reload, x1.5 speed).
setting.advdiff-forceRadiance.name = Force Radiance [WIP]
setting.advdiff-forceRadiance.description = All spawned enemies will have Radiance status effect\n(x2 health, x2 damage, x2 reload, x1.5 speed).





