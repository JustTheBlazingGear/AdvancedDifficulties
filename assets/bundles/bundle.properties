difficulty.casual-info =\n[#ffd27e]Casual:[]\nSignificantly easier difficulty.\nRecommended for a slow, casual playthrough,\n or if the hardest sectors are too much.
difficulty.easy-info = [#ffd27e]Easy:[]\nSlightly easier than normal difficulty.\nRecommended for players who are struggling with specific sectors.
difficulty.normal-info = [#ffd27e]Normal:[]\nDefault difficulty. Recommended for new players.
difficulty.hard-info = [#ffd27e]Hard:[]\nSignificantly harder difficulty.\nRecommended for experienced players.
difficulty.eradication-info = [#ffd27e]Eradication:[]\nExtremely difficult, a true challenge. Recommended for skilled players.
difficulty.unreasonable-info = [#ffd27e]ᐰᐬᑀᐲᑚᑓᐭ:[]\nSelf explanatory. Not recommended, unless you hate yourself.

calculated-global-difficulty = Calculated Global Difficulty:
calculated-global-difficulty.info = Calculates the approximate difficulty based on all applied modifiers.\nSome modifiers will be very situational, so the displayed number is far from accurate.\nFor more accuracy, make it so\n  Unit Health = Block Health\n  Unit Damage = Block Damage\n  1 / Unit Cost = Unit Build Speed = Enemy Amount Multiplier.

