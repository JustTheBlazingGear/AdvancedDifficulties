setting.advdiff-addNewReconstructors.description = Добавляет фабрики и реконструкторы юнитов которые позволят игроку строить новые уровни юнитов.\nВ данный момент имеется несколько T0 юнитов. Требуется перезагрузка игры.

difficulty.casual-info =\n[#ffd27e]Казуальная:[]\nЗначительно лёгкая сложность.\nРекомендовано для медленной, расслабляющей игры,\n или если сложнейшие сектора всё ещё трудны.
difficulty.easy-info = \n[#ffd27e]Лёгкая:[]\nСлегка легче нормальной сложности.\nРекомендовано если секторы кажутся трудными.
difficulty.normal-info = \n[#ffd27e]Нормальная:[]\nСтандартная сложность. Рекомендовано для новых игроков.
difficulty.hard-info = \n[#ffd27e]Тяжёлая:[]\nЗначительно сложнее.\nРекомендовано для опытных игроков.
difficulty.eradication-info = \n[#ffd27e]Истребляющая:[]\nОчень сложно, настоящее испытание. Рекомендовано для знатоков.
difficulty.unreasonable-info = \n[#ffd27e]ᐰᐬᑀᐲᑚᑓᐭ:[]\nНе требует пояснений. Не рекомендовано, только если вы себя ненавидите.

calculated-global-difficulty = Вычисленная глобальная сложность:
calculated-global-difficulty.info = Вычисляет примерную сложность основанную на выбранных модификаторах.\nНекоторые модификаторы могут сильно зависит от ситуации, так что показанная цифра не особо четкая.\nЧтобы было правильнее, сделайте так чтобы\n  Здоровье юнитов = Здоровье блоков\n  Урон юнитов = Урон блоков\n  1 / Стоимость юнитов = Скорость производства юнитов = Множитель количества врагов.

