advdiff-globalTeamMultiplier.info = Изменяет все множители выбранной команды.
advdiff-oneShotOneKill = Один выстрел - один труп
advdiff-oneShotOneKill.info = Юниты и постройки разрушаются от любой атаки.\nНе влияет на вычисленную глобальную сложность.

