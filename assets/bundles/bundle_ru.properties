tiers = уровней
waves = волн

advdiff-tierIncrease = Повышение уровня юнитов
advdiff-tierIncrease.info = Вражеские юниты которые приходят с волн или заводов улучшат свой уровень.\n[lightgray](кинжалы превратятся в булав, вспышки в горизонтов и т. д.).[]\nЕсли уровень не может быть дальше уменьшен/увеличен, Деградация/Сияние будут наложены,\n уменьшая надвое/удваивая здоровье и урон а также небольшое уменьшение/увеличение скорости движения и стрельбы за уровень.\n\nT0, T6 и T7 юниты запланированы, но они далеко от реализации.\n\nСовместимо в несколькими модами (но не гарантированно что будет сбалансированно):\nNew Horizon, Asthosus, Frozen Farlands, Exoprosopa.
advdiff-wavesPerWave = Волн за волну
advdiff-wavesPerWave.info = Количество волн которое отправляется за раз, в результате чего возникают более крупные и разнообразные волны.

#Toggles
advdiff-shieldsToRadiance = Щиты в Свечение
advdiff-shieldsToRadiance.info = Если юнит наберёт достаточно щитов (x2 количства его максимального здоровья если точно, следующий уровень потребует x4, потом x8 и т. д.),\nих Сияние повысится на один уровень, удваивая здоровье и урон а также небольшое увеличение скорости движения и стрельбы за уровень.\nАвтоматически включено если повышение уровня юнитов выше нуля.\nНе влияет на вычисленную глобальную сложность.
advdiff-enemyTypeRandomizer = Случайные типы юнитов
advdiff-enemyTypeRandomizer.info = Тип вражеских юнитов которые приходят с волн будут случайны.\nВлияет только на юнитов Серпуло, потому что юниты Эрекира и из модов могут застрять если превратятся в не тот тип.\nНе влияет на вычисленную глобальную сложность.
#Enrage has been unused
advdiff-enrageOnMaxUnits = Enrage On Max Units [WIP]
advdiff-enrageOnMaxUnits.info = When a spawn hits the cap, usually about 40, that spawn will gain Enraged status effect\n(x1.5 damage,x1.5 reload, x1.5 speed).\nНе влияет на вычисленную глобальную сложность.
advdiff-forceRadiance = Постоянное Сияние
advdiff-forceRadiance.info = Все появившиеся вражеские юниты получают статус Сияния, удваивая здоровье и урон а также небольшое увеличение скорости движения и стрельбы за уровень.\nИмеет 7 уровней, Сияние шестого уровня делает Кинжала достаточно сильным чтобы в одиночку одолеть Власть.

advdiff-moddedAsExtraTiers = Модовые юниты как дополнительные уровни
advdiff-exogeneissoldAsExtraTiers = Exogenesis Old
advdiff-exogeneissoldAsExtraTiers.info = Если юнит из обычной игры попытается превратится в уровень выше T5, юниты из Exogenesis мода будут использованы.\nНе используйте Java Exogenesis.\nХорошо сбалансированно.\nВключение этого модификатора при отсутствии мода ничего не сделает.
advdiff-exogenesisAsExtraTiers = Exogenesis (Java)
advdiff-exogenesisAsExtraTiers.info = Если юнит из обычной игры попытается превратится в уровень выше T5, юниты из Exogenesis мода будут использованы.\nТребуется Java версия мода.\nХоть и мод очень незаконченный, оно хорошо сбалансированно.\nЕсли включены случайные типы юнитов, вражеские юниты имеют шанс превратится в альтернативные версии.\nВключение этого модификатора при отсутствии мода ничего не сделает.
advdiff-newHorizonAsExtraTiers = New Horizon
advdiff-newHorizonAsExtraTiers.info = Если юнит из обычной игры попытается превратится в уровень выше T5, юниты из New Horizon мода будут использованы.\nВключение этого модификатора при отсутствии мода ничего не сделает.


#Statuses
status.advdiff-low-degradation.name = Низкая Деградация
status.advdiff-low-degradation.description = Значительно уменьшает все характеристики юнита.
status.advdiff-medium-degradation.name = Средняя Деградация
status.advdiff-medium-degradation.description = Сильно уменьшает все характеристики юнита.
status.advdiff-high-degradation.name = Высокая Деградация
status.advdiff-high-degradation.description = Экстремальное уменьшение всех характеристик юнита.
status.advdiff-radiance.name = Сияние
status.advdiff-radiance.description = Сияние 1-ого уровня. Увеличивает все характеристики юнита.
status.advdiff-greater-radiance.name = Великое Сияние
status.advdiff-greater-radiance.description = Сияние 2-ого уровня. Сильно увеличивает все характеристики юнита.
status.advdiff-supreme-radiance.name = Высшее Сияние
status.advdiff-supreme-radiance.description = Сияние 4-ого уровня. Экстремальное увеличивание всех характеристикик юнита.
status.advdiff-plot-armor.name = Сюжетная броня
status.advdiff-plot-armor.description = Their ignorance made them believe that everything has numbers. The bigger the number the better and stronger it is.\n\nBut It has past that, it is no longer about numbers nor symbols. However, they still believe that there are numbers; they only just have to find it.\nBut it can never be found in the first place.

#Units
#T0
unit.advdiff-butter-knife.name = Нож для масла
unit.advdiff-butter-knife.description = T0 Кинжал. Стреляет стандартными пулями с жалкой скоростью.
unit.advdiff-flea.name = Блоха
unit.advdiff-flea.description = T0 Ползун. Бежит на врагов и совершает укус, самоуничтожая себя в процессе. Воняет слабостью.
unit.advdiff-laser-pointer.name = Лазерная указка
unit.advdiff-laser-pointer.description = T0 Нова. Стреляет жалким лазерным лучом, который повреждает врагов и ремонтирует союзные постройки.
unit.advdiff-twinkle.name = Огонёк
unit.advdiff-twinkle.description = T0 Вспышка. Стреляет жалкими пулями по наземным целям.
unit.advdiff-zero.name = Ноль
unit.advdiff-zero.description = T0 Моно. Автоматически добывает медь и свинец и доставляет их в ядро с жалким темпом.
unit.advdiff-plankton.name = Планктом
unit.advdiff-plankton.description = T0 Риссо. Стреляет жалкими залпами ракет по врагам поблизости.
unit.advdiff-slug.name = Слизняк
unit.advdiff-slug.description = T0 Ретуза. Стреляет жалкими лазерными снарядами, которые повреждают врагов и ремонтируют союзные постройки.



















