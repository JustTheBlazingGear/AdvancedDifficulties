advdiff-initialWaveSpacingMultiplier.info = Не влияет на вычисленную глобальную сложность.
advdiff-captureWaveMultiplier = Множитель количеста волн для захвата
advdiff-captureWaveMultiplier.info = Не влияет на вычисленную глобальную сложность.
advdiff-dropZoneRadiusMultiplier = Множитель радиуса зоны высадки врагов
