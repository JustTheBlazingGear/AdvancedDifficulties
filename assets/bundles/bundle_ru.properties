# if you want to translate the sisyphus, probably find a translated Ultrakill Sisyphus monologue
difficulty.sisyphus = Гость? Хм... Действительно, Я проспал достаточно долго. Царство Небесное давно\nдавно забыло мое имя, и я СТРЕМЛЮСЬ заставить их вспомнить. Однако, кровь \nМиноса пачкает твою руку, и я должен признать, мне любопытно насчет твоих навыков, орудие. \nИтак, прежде чем я разрушу города и сокрушу армии Небес... \nТы, будешь как закуска. Выходи, дитя человеческое... и УМРИ.
difficulty.blablabla = Бла бла бла, бле бле бле, блю блю блю, ХАП! блублублублублублублублублу\nблублублублублублублублуб, лу-лу-лу. Линганг гули гули, гули вата, лингангу, лингангу, \nлинганг гули гули, гули вата, лингангу, лингангу. линганг гули гули, гули вата, \nлингангу, лингангу, линганг гули гули, гули вата, лингангу, лингангу.

advdiff-allowLaunchLoadout = Разрешить запуск с грузом
advdiff-allowLaunchLoadout.info = Разрешает взять с собой ресурсы при запуске на сектор.\nНе влияет на вычисленную глобальную сложность.
advdiff-launchCapacityMultiplier = Множитель вместимости запуска
advdiff-launchCapacityMultiplier.info = Насколько полным ресурсов вы сможете запустить ядро.\nНе влияет на вычисленную глобальную сложность.
advdiff-allowLaunchSchematics = Разрешить схемы запусков
advdiff-allowLaunchSchematics.info = Разрешает запуск в сектора с постройками рядом с ядром используя схемы.\nНе влияет на вычисленную глобальную сложность.

